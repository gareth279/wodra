name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to validate; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.204
      - name: Install pinned Godot .NET editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godotVersion = '4.6.2-stable'
          $root = Join-Path $env:RUNNER_TEMP 'Godot'
          $archive = Join-Path $env:RUNNER_TEMP 'Godot_mono_win64.zip'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$godotVersion/Godot_v$godotVersion`_mono_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7c530d4b45d9f7aadd788b85a4d9dbdb5f2a239a72999afd7d29fda506fbedb6') { throw 'Godot 4.6.2 mono archive checksum mismatch.' }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $matches = @(Get-ChildItem -LiteralPath $root -Filter 'Godot_v4.6.2-stable_mono_win64_console.exe' -File -Recurse)
          if ($matches.Count -ne 1) { throw "Expected exactly one Godot .NET console editor in the verified archive; found $($matches.Count)." }
          $godot = $matches[0].FullName
          "GODOT_PATH=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --version
          if ((dotnet --version).Trim() -ne '10.0.204') { throw 'Unexpected .NET SDK version.' }
          & $env:GODOT_PATH --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version probe failed.' }
      - name: Test safe local release credential selection
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/GitHubReleaseAuth.Tests.ps1
      - name: Build solution without proprietary EOS SDK
        shell: pwsh
        run: dotnet build wodra.sln -c ${{ matrix.configuration }} -m:1 -p:EnableEpicOnlineServices=false -p:NuGetAudit=false
      - name: Launch source project headlessly
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $importLog = "$env:RUNNER_TEMP\wodra-import.log"
          & $env:GODOT_PATH --headless --editor --path src/IndoorCycling.Game --import --quit --log-file $importLog
          if ($LASTEXITCODE -ne 0) { throw 'Godot headless resource import failed.' }
          dotnet build src/IndoorCycling.Game/IndoorCycling.Game.csproj -c Debug -m:1 -p:EnableEpicOnlineServices=false -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Godot game assembly build for headless startup failed.' }
          $startupLog = "$env:RUNNER_TEMP\wodra-headless.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --quit-after 2 --log-file $startupLog
          if ($LASTEXITCODE -ne 0) { throw 'Godot headless startup failed.' }
          $startupOutput = Get-Content -LiteralPath $startupLog -Raw
          if ($startupOutput -match 'Main scene''s path could not be resolved|Cannot instantiate C# script|SCRIPT ERROR:') {
            throw 'Godot headless startup reported project or C# script-loading errors.'
          }
          $connectionLog = "$env:RUNNER_TEMP\wodra-device-connection-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/DeviceConnectionAutomationReviewTest.tscn --log-file $connectionLog
          if ($LASTEXITCODE -ne 0) { throw 'Production device connection automation scene test failed.' }
          $connectionOutput = Get-Content -LiteralPath $connectionLog -Raw
          if ($connectionOutput -notmatch '\[DeviceConnectionAutomationReview\] PASS:' -or
              $connectionOutput -match 'SCRIPT ERROR:|\[DeviceConnectionAutomationReview\] FAIL:') {
            throw 'Production device connection automation scene test did not report a clean pass.'
          }
          $trafficLog = "$env:RUNNER_TEMP\wodra-ambient-traffic-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/AmbientTrafficFollowingReviewTest.tscn --log-file $trafficLog
          if ($LASTEXITCODE -ne 0) { throw 'Production ambient traffic following scene test failed.' }
          $trafficOutput = Get-Content -LiteralPath $trafficLog -Raw
          if ($trafficOutput -notmatch '\[AmbientTrafficFollowingReview\] PASS:' -or
              $trafficOutput -match 'SCRIPT ERROR:|\[AmbientTrafficFollowingReview\] FAIL:') {
            throw 'Production ambient traffic following scene test did not report a clean pass.'
          }
          $ambientCarRideLog = "$env:RUNNER_TEMP\wodra-ambient-car-ride-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/AmbientCarRideScreenReviewTest.tscn --log-file $ambientCarRideLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen ambient car interaction review failed.' }
          $ambientCarRideOutput = Get-Content -LiteralPath $ambientCarRideLog -Raw
          if ($ambientCarRideOutput -notmatch '\[AmbientCarRideScreenReview\] PASS:' -or
              $ambientCarRideOutput -match 'SCRIPT ERROR:|\[AmbientCarRideScreenReview\] FAIL:') {
            throw 'Production RideScreen ambient car interaction review did not report a clean pass.'
          }
          $ambientCarYieldLog = "$env:RUNNER_TEMP\wodra-ambient-car-yield-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/AmbientCarPlayerYieldRideScreenReviewTest.tscn --log-file $ambientCarYieldLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen local-player car-yield review failed.' }
          $ambientCarYieldOutput = Get-Content -LiteralPath $ambientCarYieldLog -Raw
          if ($ambientCarYieldOutput -notmatch '\[AmbientCarRideScreenReview\] PASS:.*direction=player caught car' -or
              $ambientCarYieldOutput -match 'SCRIPT ERROR:|\[AmbientCarRideScreenReview\] FAIL:') {
            throw 'Production RideScreen local-player car-yield review did not report a clean pass.'
          }
          $physicsInvariantLog = "$env:RUNNER_TEMP\wodra-ride-physics-traffic-invariance.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/RidePhysicsAmbientTrafficInvarianceReviewTest.tscn --log-file $physicsInvariantLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen rider-physics traffic-invariance review failed.' }
          $physicsInvariantOutput = Get-Content -LiteralPath $physicsInvariantLog -Raw
          if ($physicsInvariantOutput -notmatch '\[RidePhysicsAmbientTrafficInvarianceReview\] PASS:' -or
              $physicsInvariantOutput -match 'SCRIPT ERROR:|\[RidePhysicsAmbientTrafficInvarianceReview\] FAIL:') {
            throw 'Production RideScreen rider-physics traffic-invariance review did not report a clean pass.'
          }
          $offlinePacerLog = "$env:RUNNER_TEMP\wodra-offline-pacer-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/OfflinePacerRideScreenReviewTest.tscn --log-file $offlinePacerLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen offline pacer review failed.' }
          $offlinePacerOutput = Get-Content -LiteralPath $offlinePacerLog -Raw
          if ($offlinePacerOutput -notmatch '\[OfflinePacerRideScreenReview\] PASS:' -or
              $offlinePacerOutput -match 'SCRIPT ERROR:|\[OfflinePacerRideScreenReview\] FAIL:') {
            throw 'Production RideScreen offline pacer review did not report a clean pass.'
          }
          $routeCatalogueLog = "$env:RUNNER_TEMP\wodra-route-catalogue-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/RouteCatalogueRideScreenReviewTest.tscn --log-file $routeCatalogueLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen route catalogue review failed.' }
          $routeCatalogueOutput = Get-Content -LiteralPath $routeCatalogueLog -Raw
          if ($routeCatalogueOutput -notmatch '\[RouteCatalogueReview\] PASS:.*Options navigation preserves the selected pacer' -or
              $routeCatalogueOutput -match 'SCRIPT ERROR:|\[RouteCatalogueReview\] FAIL:') {
            throw 'Production RideScreen route catalogue review did not report a clean pass.'
          }
          $rideHistoryLog = "$env:RUNNER_TEMP\wodra-ride-history-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/RideHistoryReviewTest.tscn --log-file $rideHistoryLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen ride-history review failed.' }
          $rideHistoryOutput = Get-Content -LiteralPath $rideHistoryLog -Raw
          if ($rideHistoryOutput -notmatch '\[RideHistoryReview\] PASS' -or
              $rideHistoryOutput -match 'SCRIPT ERROR:|\[RideHistoryReview\] FAIL') {
            throw 'Production RideScreen ride-history review did not report a clean pass.'
          }
          $ambientCarOvalLog = "$env:RUNNER_TEMP\wodra-ambient-car-oval-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/AmbientCarOvalRouteReviewTest.tscn --log-file $ambientCarOvalLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen ambient car interaction review on the second Dunedin route failed.' }
          $ambientCarOvalOutput = Get-Content -LiteralPath $ambientCarOvalLog -Raw
          if ($ambientCarOvalOutput -notmatch '\[AmbientCarRideScreenReview\] PASS: production route=dunedin-one-way-oval-gardens' -or
              $ambientCarOvalOutput -match 'SCRIPT ERROR:|\[AmbientCarRideScreenReview\] FAIL:') {
            throw 'Production RideScreen ambient car interaction review did not pass on the second Dunedin route.'
          }
          $riderTrafficLog = "$env:RUNNER_TEMP\wodra-rider-traffic-review.log"
          & $env:GODOT_PATH --headless --path src/IndoorCycling.Game --scene res://Tests/RiderTrafficRideScreenReviewTest.tscn --log-file $riderTrafficLog
          if ($LASTEXITCODE -ne 0) { throw 'Production RideScreen rider/traffic interaction review failed.' }
          $riderTrafficOutput = Get-Content -LiteralPath $riderTrafficLog -Raw
          if ($riderTrafficOutput -notmatch '\[RiderTrafficRideScreenReview\] PASS:' -or
              $riderTrafficOutput -match 'SCRIPT ERROR:|\[RiderTrafficRideScreenReview\] FAIL:') {
            throw 'Production RideScreen rider/traffic review did not report a clean pass.'
          }
      - name: Install PHP runtime for Strava broker checks
        if: matrix.configuration == 'Release'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, openssl
          coverage: none
      - name: Check Strava PHP broker
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: php hosting/wodra-strava-broker/tests/run.php
      - name: Run regression suites
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'tests/IndoorCycling.Physics.Tests/IndoorCycling.Physics.Tests.csproj',
            'tests/IndoorCycling.Persistence.Tests/IndoorCycling.Persistence.Tests.csproj',
            'tests/IndoorCycling.Recording.Tests/IndoorCycling.Recording.Tests.csproj',
            'tests/IndoorCycling.Trainer.Recovery.Tests/IndoorCycling.Trainer.Recovery.Tests.csproj',
            'tests/IndoorCycling.VisualRoute.Tests/IndoorCycling.VisualRoute.Tests.csproj',
            'tests/Wodra.Multiplayer.Integration.Tests/Wodra.Multiplayer.Integration.Tests.csproj',
            'tests/Wodra.Multiplayer.Protocol.Tests/Wodra.Multiplayer.Protocol.Tests.csproj',
            'tests/Wodra.RouteBuilder.Tests/Wodra.RouteBuilder.Tests.csproj',
            'tests/Wodra.Strava.Client.Tests/Wodra.Strava.Client.Tests.csproj',
            'tests/Wodra.Strava.Broker.Tests/Wodra.Strava.Broker.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet run --project $project -c Release -p:EnableEpicOnlineServices=false -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw "Regression suite failed: $project" }
          }

